<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#grad1)"/>
  
  <!-- Graph Structure -->
  <!-- Start Node -->
  <circle cx="14" cy="16" r="4" fill="#FFFFFF" opacity="0.9"/>
  <!-- Middle Node -->
  <circle cx="24" cy="28" r="4.5" fill="url(#grad2)" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Gate/Output Node -->
  <circle cx="34" cy="16" r="4" fill="#34D399" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Bottom Node -->
  <circle cx="32" cy="34" r="3.5" fill="#FBBF24"/>
  
  <!-- Edges -->
  <path d="M17 19 L21 25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M27 25 L31 19" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M26 31 L30 33" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <!-- Checkmark on output node -->
  <path d="M32.5 16 L33.5 17.5 L36 14.5" stroke="#065F46" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
